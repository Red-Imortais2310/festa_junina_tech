<!-- quimica.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Química Junina-Tech</title>
    <link rel="stylesheet" href="../css/quimica.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-back">Voltar</a>
        <h1>Química: Espectrometria de Fogos</h1>
        <p>A queima de fogos Verde e Amarelo é pura química! Escolha os sais atômicos abaixo para acender os fogos artificiais da Copa e ver seu espectro de emissão.</p>

        <div class="button-deck">
            <button onclick="triggerExplosion('#38b000', 'Bário (Ba)')">Bário [Verde Brasil]</button>
            <button onclick="triggerExplosion('#ffd000', 'Sódio (Na)')">Sódio [Amarelo Ouro]</button>
            <button onclick="triggerExplosion('#00e5ff', 'Cobre (Cu)')">Cobre [Azul Copa]</button>
            <button onclick="triggerExplosion('#ff0055', 'Estrôncio (Sr)')">Estrôncio [Vermelho]</button>
        </div>

        <div class="lab-stage">
            <canvas id="chem-canvas" width="600" height="300"></canvas>
            <div id="element-label" class="element-info">Selecione um elemento acima para queimar no bico de Bunsen...</div>
        </div>
    </div>
    <script src="../js/quimica.js"></script>
</body>
</html>
