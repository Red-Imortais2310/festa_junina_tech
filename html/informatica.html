<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Informática Junina-Tech</title>
    <link rel="stylesheet" href="../css/informatica.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-back">Voltar</a>
        <h1>O Algoritmo da Fogueira</h1>
        <p>Insira uma palavra ou caractere para ver sua conversão em Lógica Binária e o comportamento lógico das "Bandeirinhas de LED".</p>

        <div class="console-box">
            <input type="text" id="binary-input" placeholder="Digite seu nome ou texto..." max="15">
            <div id="binary-output" class="binary-monitor">00000000</div>
        </div>

        <div class="led-panel">
            <h3>Sinalizadores Lógicos (Bandeirinhas Binárias)</h3>
            <div id="leds-container" class="led-grid"></div>
        </div>
    </div>
    <script src="../js/informatica.js"></script>
</body>
</html>
